<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#0d141e">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Alpha OT">
<link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/apple-touch-icon-180.png" sizes="180x180">
<title>Alpha OT — Seniority</title>
<style>
:root{--bg:#f3f6fa;--surface:#fff;--line:#dbe3ec;--text:#172638;--muted:#64758a;--navy:#17324d;--blue:#205f91;--blue-soft:#e7f1f9;--green:#176c51;--green-soft:#e5f5ee;--amber:#916115;--amber-soft:#fff3dd;--red:#9b3540;--red-soft:#fdebed}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;line-height:1.4}
.app{max-width:820px;margin:auto;padding:0 18px calc(56px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:9;margin:0 -18px;padding:calc(17px + env(safe-area-inset-top)) 18px 15px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}
.head{display:flex;align-items:center;justify-content:space-between;gap:16px}.title,.brand{min-width:0}.brandTitle,h1{margin:0;font-size:23px;line-height:1.12;letter-spacing:-.035em;font-weight:760;color:var(--navy)}.sub{font-size:12px;color:var(--muted);margin-top:4px}.pill{flex:0 0 auto;padding:5px 10px;border:1px solid #cbdceb;border-radius:999px;background:#f0f6fb;color:#315875;font-size:12px;font-weight:650;white-space:nowrap}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}button{min-height:42px;border:1px solid transparent;border-radius:8px;padding:9px 13px;font-family:inherit;font-size:13px;font-weight:650;line-height:1.25;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #82b6dd;outline-offset:2px}.dark{background:#fff;color:var(--navy);border-color:#ccd8e4}.dark:hover{background:#f2f6fa}.blue{background:var(--navy);color:white}.blue:hover{background:#244d72}.hidden{display:none!important}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:20px 0 13px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:13px 15px}.stat b{display:block;font-size:25px;line-height:1.15;font-weight:750;font-variant-numeric:tabular-nums}.stat span{display:block;margin-top:5px;color:var(--muted);font-size:12px;font-weight:600}
.note{margin:12px 0 19px;padding:11px 14px;background:#eaf1f7;border:1px solid #d6e3ee;border-radius:9px;color:#4d6378;font-size:13px;line-height:1.45}.section{margin:21px 2px 10px;color:#596d80;font-size:12px;font-weight:750;text-transform:uppercase;letter-spacing:.085em}
.card,.rowcard{background:var(--surface);border:1px solid var(--line);border-radius:11px;margin-bottom:9px;overflow:hidden;box-shadow:0 1px 2px #17324d0a}.main{display:grid;grid-template-columns:56px minmax(0,1fr);align-items:start;gap:14px;padding:15px}.num{width:48px;height:48px;display:grid;place-items:center;border-radius:9px;background:var(--blue-soft);color:var(--blue);font-size:20px;font-weight:750;font-variant-numeric:tabular-nums}.num.off{background:#eef1f4;color:#738292}.nameRow{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.name{font-size:17px;font-weight:720;letter-spacing:-.012em}.badge{display:inline-block;padding:3px 8px;border-radius:5px;font-size:11px;font-weight:650}.active{background:var(--green-soft);color:var(--green)}.offshift,.unavailbadge{background:#eef1f4;color:#596b7a}.vacation{background:var(--amber-soft);color:var(--amber)}.powerbadge{background:#f1eaf6;color:#765583}.calledoffbadge{background:var(--red-soft);color:var(--red)}.meta{margin-top:6px;color:#45586b;font-size:13px}.date{margin-top:2px;color:var(--muted);font-size:12px}.powercard{border-left:3px solid #a885b5}.num.power{background:#f1eaf6;color:#765583}.power-ineligible,.temp-unavailable{background:#f8f9fb}.power-ineligible .name,.temp-unavailable .name{color:#627182}
.actions{padding:9px 15px;border-top:1px solid var(--line);background:#fbfcfe}.actions button{min-height:36px}.editor{display:none;padding:15px;border-top:1px solid var(--line);background:#f8fafc}.card.open .editor{display:block}label{display:block;margin:12px 0 6px;font-size:13px;font-weight:700}select,input{width:100%;padding:11px 12px;border:1px solid #c5d2df;border-radius:8px;background:#fff;color:var(--text);font-size:16px}.row,.twocol{display:flex;gap:8px;margin-top:15px}.row>*,.twocol>*{flex:1}
dialog{width:min(92vw,560px);max-height:85vh;overflow:auto;padding:0;border:1px solid var(--line);border-radius:12px;background:white;color:var(--text);box-shadow:0 20px 65px #132b4150}dialog::backdrop{background:#132b4170}.modal{padding:20px}.modal h2{margin:0 0 8px;font-size:21px}.help{color:var(--muted);font-size:13px;line-height:1.5}.error{color:var(--red);font-size:13px;margin-top:10px}.ok{color:var(--green);font-size:12px;font-weight:700}.toast{position:fixed;left:50%;bottom:24px;z-index:20;max-width:90vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transform:translateX(-50%);padding:10px 15px;border-radius:8px;background:var(--navy);color:#fff;box-shadow:0 8px 26px #132b4140;opacity:0;transition:opacity .2s}.toast.show{opacity:1}
@media(max-width:460px){.app{padding-left:12px;padding-right:12px}header{margin:0 -12px;padding-left:12px;padding-right:12px}.brandTitle,h1{font-size:21px}.tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.tools button{min-width:0;padding:8px 5px;font-size:12px}.stat{padding:11px 10px}.stat b{font-size:23px}.main{grid-template-columns:46px minmax(0,1fr);gap:10px;padding:13px 11px}.num{width:42px;height:42px;font-size:18px}.name{font-size:16px}}
@media(max-width:345px){.brandTitle,h1{font-size:19px}.pill{font-size:10px;padding:5px 7px}.tools button{font-size:11px}}

.rowcard{display:grid;grid-template-columns:48px minmax(0,1fr) auto;align-items:center;gap:14px;padding:12px 15px}.editbtn{min-height:36px}.rowcard .name{overflow-wrap:anywhere}@media(max-width:460px){.rowcard{grid-template-columns:42px minmax(0,1fr) auto;gap:10px;padding:11px}.editbtn{padding:8px}}
</style>
<link rel="manifest" href="manifest.webmanifest?v=20261003-dark-training-v1"><link rel="stylesheet" href="alpha-dark-v1.css"></head>
<body>
<div class="app">
<header>
<div class="head">
<div class="title"><h1>Seniority</h1><div class="sub">Alpha Crew department list</div></div>
<div id="mode" class="pill">View only</div>
</div>
<div class="tools">
<button class="dark" onclick="location.href='index.html'">← Overtime</button>
<button class="dark" onclick="loadAll()">Refresh</button>
<button id="addBtn" class="dark hidden" onclick="openAdd()">+ Add Officer</button>
</div>
</header>

<div class="note">This seniority list is separate from the overtime rotation. Changes here do not change OT order.</div>
<div class="section">Seniority Order</div>
<div id="list"></div>
</div>

<dialog id="editDlg"><div class="modal">
<h2 id="editTitle">Edit Officer</h2>
<label>Name</label>
<input id="editName" autocomplete="off">
<label>Seniority Number</label>
<input id="editPos" type="number" min="1" inputmode="numeric">
<div class="twocol"><button class="dark" onclick="editDlg.close()">Cancel</button><button class="blue" onclick="saveEdit()">Save</button></div>
<div class="twocol"><button style="background:#5b1616;color:#ffb3b3;border:1px solid #9b2a2a" onclick="deleteOfficer()">Delete Officer</button></div>
</div></dialog>

<dialog id="addDlg"><div class="modal">
<h2>Add Officer</h2>
<label>Name</label>
<input id="newName" autocomplete="off">
<label>Seniority Number</label>
<input id="newPos" type="number" min="1" inputmode="numeric" placeholder="Leave blank to add at bottom">
<div class="twocol"><button class="dark" onclick="addDlg.close()">Cancel</button><button class="blue" onclick="addOfficer()">Add</button></div>
</div></dialog>
<div id="toast" class="toast"></div>

<script>
const U='https://hvihhsrhoqbbhkobayhx.supabase.co',K='sb_publishable_XrolNcWigiHLyj_96h7TmA_306hd00Y';
let session=JSON.parse(localStorage.getItem('alpha_session')||'null'),role='viewer',rows=[],editingId=null;
function headers(auth=true){let h={'apikey':K,'Content-Type':'application/json'};h.Authorization='Bearer '+(auth&&session?.access_token?session.access_token:K);return h}
async function api(path,opt={}){let r=await fetch(U+path,{...opt,headers:{...headers(opt.auth!==false),...(opt.headers||{})}}),txt=await r.text(),data;try{data=txt?JSON.parse(txt):null}catch{data=txt}if(!r.ok)throw new Error(data?.msg||data?.message||data?.error_description||data?.hint||('HTTP '+r.status));return data}
function toast(m){let t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('show'),2200)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
async function loadRole(){role='viewer';if(session?.access_token){try{let p=await api('/rest/v1/profiles?select=role&id=eq.'+encodeURIComponent(session.user.id));if(p?.[0]?.role)role=p[0].role}catch(e){session=null;localStorage.removeItem('alpha_session')}}mode.textContent=role==='admin'?'Admin':'View only';addBtn.classList.toggle('hidden',role!=='admin')}
async function loadAll(){try{rows=await api('/rest/v1/seniority?select=id,name,position&order=position.asc',{auth:false});render()}catch(e){toast('Unable to load seniority: '+e.message)}}
function render(){list.innerHTML='';for(let r of rows){let c=document.createElement('div');c.className='rowcard';c.innerHTML='<div class="num">'+r.position+'</div><div class="name">'+esc(r.name)+'</div>'+(role==='admin'?'<button class="dark editbtn" onclick="openEdit(\''+r.id+'\')">Edit</button>':'');list.appendChild(c)}}
function openEdit(id){if(role!=='admin')return;let r=rows.find(x=>x.id===id);if(!r)return;editingId=id;editTitle.textContent='Edit '+r.name;editName.value=r.name;editPos.value=r.position;editDlg.showModal()}
async function saveEdit(){if(role!=='admin'||!editingId)return;let name=editName.value.trim(),p=parseInt(editPos.value,10);if(!name)return toast('Enter a name');if(!p||p<1)return toast('Enter a valid number');try{await api('/rest/v1/rpc/seniority_update_officer_auth',{method:'POST',body:JSON.stringify({p_id:editingId,p_name:name,p_position:p})});editDlg.close();toast('Seniority updated');await loadAll()}catch(e){toast(e.message)}}
async function deleteOfficer(){if(role!=='admin'||!editingId)return;let r=rows.find(x=>x.id===editingId);if(!r)return;if(!confirm('Delete '+r.name+' from the seniority list? Everyone below will move up one spot.'))return;try{await api('/rest/v1/rpc/seniority_delete_officer_auth',{method:'POST',body:JSON.stringify({p_id:editingId})});editDlg.close();toast(r.name+' deleted');editingId=null;await loadAll()}catch(e){toast(e.message)}}
function openAdd(){if(role!=='admin')return;newName.value='';newPos.value='';addDlg.showModal()}
async function addOfficer(){if(role!=='admin')return;let name=newName.value.trim();if(!name)return toast('Enter a name');let p=newPos.value?parseInt(newPos.value,10):null;try{await api('/rest/v1/rpc/seniority_add_officer_auth',{method:'POST',body:JSON.stringify({p_name:name,p_position:p})});addDlg.close();toast(name+' added');await loadAll()}catch(e){toast(e.message)}}
(async()=>{await loadRole();await loadAll()})();setInterval(loadAll,30000);
</script>
</body>
</html>
